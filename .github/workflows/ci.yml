name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile sources
        run: |
          python -m compileall src/

      - name: Run unit tests
        run: |
          pytest -v

      - name: Import smoke test
        run: |
          python -c "import yaml, psutil, requests, dotenv"
          python -c "from syswatcher.monitor import get_system_metrics; print('metrics_ok', isinstance(get_system_metrics(), dict))"
