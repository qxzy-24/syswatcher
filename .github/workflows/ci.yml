name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources
        run: |
          python -m py_compile main.py logger.py monitor.py notifier.py
          python -m compileall .

      - name: Import smoke test
        run: |
          python -c "import yaml, psutil, requests"
          python -c "from monitor import get_system_metrics; print('metrics_ok', isinstance(get_system_metrics(), dict))"
